<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Výběr fotky – Vodácká 30</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#0b1220;color:#e6edf6;font:14px/1.5 system-ui,-apple-system,sans-serif}
  header{position:sticky;top:0;z-index:10;padding:16px 20px;border-bottom:1px solid #1e2b45;background:#0b1220ee;backdrop-filter:blur(8px)}
  h1{margin:0;font-size:17px}
  header p{margin:6px 0 0;color:#9fb0c9;font-size:13px;max-width:70ch}
  .now{margin-top:10px;font-size:12px;color:#7dd3fc}
  .now code{background:#132038;padding:2px 6px;border-radius:4px}
  section{padding:22px 20px 34px;border-bottom:1px solid #16233c}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:.2em;color:#7dd3fc;margin:0 0 4px}
  .meta{color:#8fa2bd;font-size:12px;margin:0 0 14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
  figure{margin:0;background:#111a2e;border-radius:8px;overflow:hidden;cursor:pointer;border:2px solid transparent;position:relative}
  figure.sel{border-color:#7dd3fc}
  img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;background:#0f1829}
  figcaption{display:flex;justify-content:space-between;gap:8px;padding:7px 11px;font-size:11px;color:#8fa2bd;font-variant-numeric:tabular-nums}
  .pick{position:fixed;right:16px;bottom:16px;z-index:20;padding:12px 16px;border-radius:10px;background:#1565a1;color:#fff;font-weight:600;font-size:13px;display:none;max-width:80vw}
  .pick code{background:#0b2b47;padding:2px 6px;border-radius:4px}
  a{color:#7dd3fc}
</style>
</head>
<body>
<header>
  <h1>Vodácká 30 – výběr fotky na homepage (hero)</h1>
  <p>Kandidáti jsou seřazení podle času focení (EXIF) – první snímky v albu zachycují start/začátek závodu.
     Klikni na fotku, dole se ukáže její ID a hotová URL pro hero ve velikosti 1920×1280. Pak mi ID napiš.</p>
  <div class="now">Teď nasazené v hero: <code id="nowId">–</code></div>
</header>
<div id="out"></div>
<div class="pick" id="pick">Vybráno: <code id="pickId">–</code> &middot; <span id="pickUrl"></span></div>

<script>
// id | čas focení – seřazeno podle EXIF DateTimeOriginal vzestupně (start = první snímky).
var albums = [
  { rok: 2025, nazev: 'Vodácká 30tka 2025', url: 'https://eu.zonerama.com/milvin/Album/12759760', fotky: [
    ['510724205','12:24:43'],['510724207','12:26:46'],['510724209','12:28:56'],['510724208','12:31:32'],
    ['510724204','12:33:31'],['510724206','12:35:39'],['510724212','12:37:22'],['510724210','12:38:57'],
    ['510724215','12:39:10'],['510724217','12:39:44'],['510724220','12:41:31'],['510724216','12:41:38'],
    ['510724218','12:41:43'],['510724219','12:41:46'],['510724222','12:42:02']
  ]},
  { rok: 2024, nazev: 'Vodácká 30tka 2024', url: 'https://eu.zonerama.com/milvin/Album/10982395', fotky: [
    ['436112131','11:32:43'],['436112132','11:54:51'],['436112134','12:13:54'],['436112130','12:16:29'],
    ['436112138','12:16:45'],['436112141','12:21:50'],['436112143','12:27:58'],['436112152','12:32:40'],
    ['436112158','12:33:11'],['436112159','12:33:29'],['436112165','12:35:39'],['436112164','12:36:01'],
    ['436112179','12:37:48'],['436112177','12:38:12'],['436112186','12:41:06'],['436112190','12:41:30'],
    ['436112187','12:42:05'],['436112199','12:43:13'],['436112204','12:43:16'],['436112200','12:43:18']
  ]}
];

var NOW = '510724217';
document.getElementById('nowId').textContent = NOW;

var out = document.getElementById('out');
albums.forEach(function (a) {
  var html = '<section><h2>' + a.nazev + ' – start</h2>'
    + '<p class="meta">' + a.fotky.length + ' kandidátů podle času focení &middot; '
    + '<a href="' + a.url + '" target="_blank" rel="noopener">otevřít album ↗</a></p><div class="grid">';
  a.fotky.forEach(function (f) {
    html += '<figure data-id="' + f[0] + '"' + (f[0] === NOW ? ' class="sel"' : '') + '>'
      + '<img loading="lazy" src="https://eu.zonerama.com/photos/' + f[0] + '_1200x800_2.jpg" alt="' + f[0] + '"'
      + ' onerror="this.onerror=null;this.src=\'https://eu.zonerama.com/photos/' + f[0] + '_800x800_2.jpg\'">'
      + '<figcaption><span>' + f[1] + '</span><span>' + f[0] + '</span></figcaption></figure>';
  });
  html += '</div></section>';
  out.insertAdjacentHTML('beforeend', html);
});

var pick = document.getElementById('pick');
var pickId = document.getElementById('pickId');
var pickUrl = document.getElementById('pickUrl');
out.addEventListener('click', function (e) {
  var fig = e.target.closest('figure');
  if (!fig) return;
  document.querySelectorAll('figure.sel').forEach(function (f) { f.classList.remove('sel'); });
  fig.classList.add('sel');
  var id = fig.dataset.id;
  pickId.textContent = id;
  pickUrl.innerHTML = '<a href="https://eu.zonerama.com/photos/' + id + '_1920x1280_2.jpg" target="_blank" rel="noopener">1920×1280 ↗</a>';
  pick.style.display = 'block';
  if (navigator.clipboard) { navigator.clipboard.writeText(id).catch(function () {}); }
});
</script>
</body>
</html>
